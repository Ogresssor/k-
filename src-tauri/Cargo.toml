[package]
name = "kplus-shell"
version = "1.0.0"
edition = "2021"
rust-version = "1.77"
description = "Оболочка юридического помощника К+"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
