<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>К+ — юридический помощник</title>
<style>
  :root {
    --bg: #f6f6f7; --panel: #fff; --ink: #1c1c1e; --dim: #6e6e73;
    --line: #e3e3e6; --accent: #0b5cd5; --accent-ink: #fff;
    --tool: #f0f4fb; --warn: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --panel: #2c2c2e; --ink: #f2f2f7; --dim: #9a9aa0;
      --line: #3a3a3c; --accent: #4d8dff; --accent-ink: #08192f;
      --tool: #23324a; --warn: #ff6b60;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }

  header {
    padding: 10px 16px 10px 82px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
    background: var(--panel);
    -webkit-app-region: drag; user-select: none;
  }
  header .title { font-weight: 600; }
  header .status { color: var(--dim); font-size: 13px; margin-left: auto; }
  header button { -webkit-app-region: no-drag; }

  #log { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .row { max-width: 720px; margin: 0 auto 14px; }

  .bubble {
    padding: 11px 14px; border-radius: 14px; white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .me .bubble {
    background: var(--accent); color: var(--accent-ink);
    margin-left: auto; max-width: 80%; width: fit-content;
    border-bottom-right-radius: 4px;
  }
  .bot .bubble {
    background: var(--panel); border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }
  .step {
    font-size: 13px; color: var(--dim); background: var(--tool);
    border-radius: 8px; padding: 6px 10px; margin: 4px 0; width: fit-content;
    max-width: 100%;
  }
  .err .bubble { border-color: var(--warn); color: var(--warn); }

  .hint { color: var(--dim); text-align: center; padding: 40px 20px; }
  .hint ul { text-align: left; max-width: 460px; margin: 14px auto 0; padding-left: 18px; }
  .hint li { margin-bottom: 8px; }

  footer {
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 12px 16px;
  }
  .composer { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; }
  textarea {
    flex: 1; resize: none; font: inherit; color: inherit;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; min-height: 44px; max-height: 180px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    font: inherit; border: 0; border-radius: 10px; padding: 0 16px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  button.ghost {
    background: transparent; color: var(--dim); border: 1px solid var(--line);
    padding: 5px 12px; font-size: 13px; border-radius: 8px;
  }
  button:disabled { opacity: .45; cursor: default; }
  .spin {
    display: inline-block; width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid var(--dim); border-top-color: transparent;
    animation: spin .8s linear infinite; vertical-align: -1px; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <span class="title">К+</span>
  <button class="ghost" id="docs">Документы</button>
  <span class="status" id="status"><span class="spin"></span>запускаю…</span>
</header>

<div id="log">
  <div class="hint" id="hint">
    <div>Напишите, что нужно, обычными словами.</div>
    <ul>
      <li>Напиши претензию в страховую: не выплатили по ОСАГО после ДТП 12.03.2026, отказ от 05.04.2026.</li>
      <li>Найди практику: можно ли взыскать неустойку, если страховая выплатила с опозданием на два месяца.</li>
    </ul>
  </div>
</div>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ваш вопрос…" disabled></textarea>
    <button id="send" disabled>Спросить</button>
  </div>
</footer>

<script>
const log = document.getElementById("log");
const hint = document.getElementById("hint");
const input = document.getElementById("input");
const send = document.getElementById("send");
const statusEl = document.getElementById("status");
let base = null, busy = false;

// В обычном браузере Tauri нет — тогда это предпросмотр интерфейса без агента.
const tauri = window.__TAURI__ || null;

const ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;" };
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ESCAPES[c]);

function row(cls, html) {
  const el = document.createElement("div");
  el.className = "row " + cls;
  el.innerHTML = html;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

const bubble = (cls, text) => row(cls, '<div class="bubble">' + esc(text) + "</div>");

function setBusy(on) {
  busy = on;
  send.disabled = on || !ready();
  input.disabled = on || !ready();
  if (!on) input.focus();
}

let readyFlag = false;
const ready = () => readyFlag;

async function boot() {
  if (!tauri) {
    statusEl.textContent = "предпросмотр интерфейса — агент не подключён";
    readyFlag = true;
    setBusy(false);
    return;
  }
  const port = await tauri.core.invoke("api_port");
  base = "http://127.0.0.1:" + port;
  // Сайдкар поднимается за секунду-две; стучимся, пока не ответит.
  for (let i = 0; i < 120; i++) {
    try {
      const r = await fetch(base + "/health");
      if (r.ok) {
        const h = await r.json();
        const name = (h.browser || "").split("/").pop() || "браузер не найден";
        statusEl.textContent = "готов · " + name;
        readyFlag = true;
        setBusy(false);
        return;
      }
    } catch (e) {
      // сайдкар ещё поднимается
    }
    await new Promise((r) => setTimeout(r, 500));
  }
  statusEl.textContent = "агент не запустился";
}

function render(target, ev) {
  if (ev.kind === "answer") {
    target.innerHTML = '<div class="bubble">' + esc(ev.text) + "</div>";
  } else if (ev.kind === "error") {
    target.className = "row bot err";
    target.innerHTML = '<div class="bubble">' + esc(ev.text) + "</div>";
  } else {
    const s = document.createElement("div");
    s.className = "step";
    s.textContent = "→ " + ev.text;
    target.appendChild(s);
  }
  log.scrollTop = log.scrollHeight;
}

async function ask(task) {
  if (hint) hint.remove();
  bubble("me", task);
  setBusy(true);
  statusEl.innerHTML = '<span class="spin"></span>работаю…';

  if (!base) {
    bubble("bot", "Это предпросмотр интерфейса. В собранном приложении здесь будет ответ агента.");
    statusEl.textContent = "предпросмотр";
    setBusy(false);
    return;
  }

  const answer = row("bot", "");
  try {
    const resp = await fetch(base + "/ask/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task })
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const chunk = await reader.read();
      if (chunk.done) break;
      buf += dec.decode(chunk.value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith("data:")) continue;
        render(answer, JSON.parse(line.slice(5)));
      }
    }
  } catch (e) {
    render(answer, { kind: "error", text: "Не получилось: " + e });
  }
  statusEl.textContent = "готов";
  setBusy(false);
}

send.onclick = () => {
  const task = input.value.trim();
  if (!task || busy) return;
  input.value = "";
  input.style.height = "auto";
  ask(task);
};

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send.click();
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
});

document.getElementById("docs").onclick = () => {
  if (tauri) tauri.core.invoke("open_documents");
};

boot();
</script>
</body>
</html>
