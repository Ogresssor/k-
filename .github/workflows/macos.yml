# Настоящая проверка на настоящем маке. Своего мака не нужно: GitHub даёт
# macOS-раннеры на Apple Silicon, и Google Chrome на них уже установлен.
#
# Прогон повторяет путь пользователя целиком: собрать архив -> распаковать
# через tar -> запустить «Настроить.command» -> убедиться, что окно браузера
# переживает выход агента.
name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Установка и проверка на macOS
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Собрать архив
        run: python3 tools/build_archive.py -o /tmp/KPlusAgent-mac.tar.gz

      - name: Распаковать так же, как это делает пользователь
        run: |
          mkdir -p "$HOME/Applications"
          tar -xzf /tmp/KPlusAgent-mac.tar.gz -C "$HOME/Applications"

      - name: Права на исполнение уцелели в архиве
        run: |
          cd "$HOME/Applications/KPlusAgent"
          for f in "Настроить.command" "Спросить К+.command" \
                   "Отчёт об ошибке.command" kplus run_server.sh; do
            test -x "$f" || { echo "не исполняемый: $f"; exit 1; }
            echo "исполняемый: $f"
          done

      - name: Карантина нет
        run: |
          cd "$HOME/Applications/KPlusAgent"
          if xattr -lr . | grep -q quarantine; then
            echo "распаковка проставила карантин"; exit 1
          fi
          echo "карантина нет"

      - name: Chrome на месте
        run: |
          ls -d "/Applications/Google Chrome.app"
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version

      - name: Запустить «Настроить.command»
        env:
          KPLUS_UNATTENDED: "1"
        run: |
          cd "$HOME/Applications/KPlusAgent"
          cp .env.example .env
          ./Настроить.command
          test -x .venv/bin/python || { echo "окружение не создано"; exit 1; }

      - name: Главное — браузер переживает выход агента
        env:
          KPLUS_HEADLESS: "1"
        run: |
          cd "$HOME/Applications/KPlusAgent"
          ./.venv/bin/python tests/selfcheck.py

      - name: Журнал при провале
        if: failure()
        run: |
          cat "$HOME/Library/Logs/KPlusAgent/"*.log 2>/dev/null || true
          cat "$TMPDIR/kplus-selfcheck/logs/"*.log 2>/dev/null || true

  app:
    name: Сборка приложения (.app и .dmg)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rust
        run: rustc -vV

      - name: Собрать сайдкар (весь Python в одном файле)
        run: bash tools/build_sidecar.sh

      - name: Иконки приложения
        run: |
          npm install -g @tauri-apps/cli@^2
          tauri icon src-tauri/icons/source.png

      - name: Собрать .app и .dmg
        run: tauri build --bundles app,dmg

      - name: Что получилось
        run: |
          cd src-tauri/target/release/bundle
          find . -maxdepth 2 -name "*.app" -o -maxdepth 2 -name "*.dmg" | while read -r f; do
            echo "$(du -sh "$f" | cut -f1)  $f"
          done

      - name: Приложение запускается и поднимает сайдкар
        run: |
          APP="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP" || { echo "приложение не собралось"; exit 1; }
          CORE="$APP/Contents/MacOS/kplus-core"
          test -x "$CORE" || { echo "сайдкар не попал внутрь .app"; exit 1; }
          echo "сайдкар на месте: $(du -sh "$CORE" | cut -f1)"
          # Поднимаем сайдкар напрямую и проверяем, что он отвечает.
          "$CORE" --port 8791 &
          CORE_PID=$!
          for i in $(seq 1 60); do
            if curl -fsS --noproxy '*' http://127.0.0.1:8791/health > /tmp/health.json; then
              echo "сайдкар ответил:"; cat /tmp/health.json; break
            fi
            sleep 1
          done
          kill $CORE_PID 2>/dev/null || true
          test -s /tmp/health.json || { echo "сайдкар не ответил"; exit 1; }

      - name: Запустить приложение и проверить связку окна с агентом
        run: |
          APP="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)"
          mkdir -p shots

          # Ключ лежит в .env РЯДОМ с приложением, а не внутри него. Внутри —
          # временная распаковка PyInstaller, которая живёт один запуск, и
          # искать там нечего. Именно так папку получает пользователь.
          ENV_FILE="$(dirname "$APP")/.env"
          echo "KPLUS_PROVIDER=gemini" > "$ENV_FILE"
          echo "GEMINI_API_KEY=ключ-для-проверки" >> "$ENV_FILE"

          open "$APP"

          # Оболочка выбирает порт при старте, поэтому узнаём его из командной
          # строки уже запущенного сайдкара.
          PORT=""
          for i in $(seq 1 30); do
            sleep 1
            PORT="$(pgrep -lf 'kplus-core --port' | head -1 | awk '{for (i = 1; i <= NF; i++) if ($i == "--port") print $(i + 1)}')"
            [ -n "$PORT" ] && break
          done
          test -n "$PORT" || { echo "сайдкар не запустился из приложения"; exit 1; }
          echo "сайдкар слушает порт $PORT"

          # Тот же запрос, что делает окно при старте. Если он проходит —
          # связка «окно → агент» рабочая, и надпись «агент не подключён»
          # в интерфейсе появиться не может.
          for i in $(seq 1 30); do
            if curl -fsS --noproxy '*' "http://127.0.0.1:$PORT/health" > shots/health.json; then
              break
            fi
            sleep 1
          done
          test -s shots/health.json || { echo "агент не ответил окну"; exit 1; }
          echo "агент ответил:"; cat shots/health.json

          # Браузер приложение должно найти само, ничего не скачивая.
          # Starlette отдаёт JSON без пробелов, отсюда такой шаблон.
          if grep -qE '"browser": ?"/' shots/health.json; then
            echo "браузер найден"
          else
            echo "браузер не найден — приложение не сможет открыть К+"
            exit 1
          fi

          # Без ключа приложение выглядит исправным и ломается лишь на первом
          # вопросе. Проверяем, что .env рядом с .app подхватился.
          if grep -qE '"model_key": ?true' shots/health.json; then
            echo "ключ модели подхвачен из .env рядом с приложением"
          else
            echo "приложение не нашло ключ в .env рядом с собой"
            exit 1
          fi

          # Главная проверка: доложило ли САМО ОКНО, что достучалось до
          # агента. Ответа curl тут мало — прошлый прогон его получал, а
          # окно в это время висело на «запускаю…», потому что WebKit резал
          # его запрос как смешанное содержимое. Про такой сбой знает
          # только окно, и оно сообщает о нём через команду ui_ready.
          # Приложение, запущенное через open, может получить свой TMPDIR,
          # отличный от шелловского — поэтому ищем в обоих местах.
          STATE=""
          for i in $(seq 1 40); do
            for candidate in "$TMPDIR/kplus-ui-state.json" /tmp/kplus-ui-state.json; do
              [ -f "$candidate" ] && STATE="$candidate" && break 2
            done
            sleep 1
          done
          if [ -z "$STATE" ]; then
            echo "окно не доложило о запуске за 40 секунд — оно зависло"
            exit 1
          fi
          cp "$STATE" shots/ui-state.json
          echo "окно доложило:"; cat shots/ui-state.json; echo
          grep -q '"ok":true' shots/ui-state.json || {
            echo "окно не смогло связаться с агентом"; exit 1; }

          # Снимок ровно один: macOS 15 после первого вызова screencapture
          # показывает запрос на доступ к экрану, и все следующие снимки
          # состоят из этого диалога.
          screencapture -x shots/приложение.png

          {
            echo "=== процессы ==="
            pgrep -lf "KPlus|kplus-core" || echo "ничего"
            echo
            echo "=== окна ==="
            osascript -e 'tell application "System Events" to get name of every process whose visible is true' || true
          } > shots/состояние.txt 2>&1
          cat shots/состояние.txt

          osascript -e 'quit app "KPlus"' 2>/dev/null || true
          pkill -f kplus-core 2>/dev/null || true

      - name: Собрать папку, готовую к отправке
        run: |
          # Права на исполнение внутри .app обязаны уцелеть. Zip, которым
          # upload-artifact пакует файлы, их теряет — приложение из него
          # просто не запустится. Поэтому кладём .app в tar заранее, здесь,
          # на маке: tar права хранит.
          BUNDLE="src-tauri/target/release/bundle/macos"
          PACK="$RUNNER_TEMP/pack/KPlusAgent"
          mkdir -p "$PACK"
          cp -R "$BUNDLE/KPlus.app" "$PACK/"
          cp .env.example "$PACK/.env.example"
          cp "КАК ЗАПУСТИТЬ.md" "$PACK/"

          # Проверочного .env с ключом-пустышкой в отправляемой папке быть
          # не должно.
          rm -f "$PACK/.env"

          tar -czf KPlusAgent-portable.tar.gz -C "$RUNNER_TEMP/pack" KPlusAgent
          echo "размер: $(du -h KPlusAgent-portable.tar.gz | cut -f1)"

          # Убеждаемся, что бит x доехал.
          tar -tvzf KPlusAgent-portable.tar.gz             | grep "KPlus.app/Contents/MacOS/"             | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: KPlusAgent-готовый
          path: KPlusAgent-portable.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: KPlus-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Снимки-экрана
          path: shots/
          if-no-files-found: warn
